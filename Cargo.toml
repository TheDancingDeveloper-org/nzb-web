[package]
name = "nzb-web"
version = "0.1.0"
edition = "2024"
description = "Usenet download engine: queue management, download orchestration, and background services"
license = "MIT"
repository = "https://github.com/AusAgentSmith-org/nzb-web"

[dependencies]
nzb-decode = { path = "/home/sprooty/Working/libs/nzb-decode" }
nzb-postproc = { path = "/home/sprooty/Working/libs/nzb-postproc" }
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
http = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
rand = "0.9"
hex = "0.4"
base64 = "0.22"
governor = "0.8"
arc-swap = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
notify = "8"
feed-rs = "2"
regex = "1"
libc = "0.2"
unicode-normalization = "0.1"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused = "warn"
